<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" style="background-color:#FFFFFF; font-family: Plus Jakarta Sans, Arial, sans-serif;">
  <g id="kortisol-molecule" stroke="#111827" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- RING A (6-membered) -->
    <!-- C3=O -->
    <line x1="88" y1="352" x2="52" y2="372" stroke-width="2.6"/>
    <line x1="93" y1="360" x2="57" y2="380" stroke-width="2.6"/>
    <text x="32" y="392" font-size="22" font-weight="bold" fill="#111827" stroke="none">O</text>

    <!-- C3 to C4 -->
    <line x1="92" y1="356" x2="136" y2="382"/>
    <!-- C4=C5 (Double bond) -->
    <line x1="136" y1="382" x2="180" y2="356"/>
    <line x1="136" y1="371" x2="173" y2="349"/>
    <!-- C5 to C10 -->
    <line x1="180" y1="356" x2="180" y2="304"/>
    <!-- C10 to C1 -->
    <line x1="180" y1="304" x2="136" y2="278"/>
    <!-- C1 to C2 -->
    <line x1="136" y1="278" x2="92" y2="304"/>
    <!-- C2 to C3 -->
    <line x1="92" y1="304" x2="92" y2="356"/>

    <!-- C10 Angular Methyl (C19) -->
    <polygon points="177,304 183,304 182,246 178,246" fill="#111827" stroke="#111827"/>

    <!-- RING B (6-membered) -->
    <!-- C5 to C6 -->
    <line x1="180" y1="356" x2="224" y2="382"/>
    <!-- C6 to C7 -->
    <line x1="224" y1="382" x2="268" y2="356"/>
    <!-- C7 to C8 -->
    <line x1="268" y1="356" x2="268" y2="304"/>
    <!-- C8 to C9 -->
    <line x1="268" y1="304" x2="224" y2="278"/>
    <!-- C9 to C10 -->
    <line x1="224" y1="278" x2="180" y2="304"/>

    <!-- C9 alpha-H (dashed) -->
    <line x1="220" y1="286" x2="228" y2="286" stroke-width="2.2"/>
    <line x1="221" y1="294" x2="227" y2="294" stroke-width="2.2"/>
    <line x1="222" y1="302" x2="226" y2="302" stroke-width="2.2"/>
    <text x="219" y="326" font-size="19" font-weight="bold" fill="#111827" stroke="none">H</text>

    <!-- C8 beta-H (wedged) -->
    <polygon points="265,304 271,304 270,250 266,250" fill="#111827" stroke="#111827"/>
    <text x="261" y="240" font-size="19" font-weight="bold" fill="#111827" stroke="none">H</text>

    <!-- RING C (6-membered) -->
    <!-- C8 to C14 -->
    <line x1="268" y1="304" x2="312" y2="278"/>
    <!-- C14 to C13 -->
    <line x1="312" y1="278" x2="312" y2="226"/>
    <!-- C13 to C12 -->
    <line x1="312" y1="226" x2="268" y2="200"/>
    <!-- C12 to C11 -->
    <line x1="268" y1="200" x2="224" y2="226"/>
    <!-- C11 to C9 -->
    <line x1="224" y1="226" x2="224" y2="278"/>

    <!-- C11 beta-OH (wedged) -->
    <polygon points="222,226 226,226 200,190 196,194" fill="#111827" stroke="#111827"/>
    <text x="150" y="195" font-size="20" font-weight="bold" fill="#111827" stroke="none">HO</text>

    <!-- C13 Angular Methyl (C18) -->
    <polygon points="309,226 315,226 314,170 310,170" fill="#111827" stroke="#111827"/>

    <!-- C14 alpha-H (dashed) -->
    <line x1="308" y1="286" x2="316" y2="286" stroke-width="2.2"/>
    <line x1="309" y1="294" x2="315" y2="294" stroke-width="2.2"/>
    <line x1="310" y1="302" x2="314" y2="302" stroke-width="2.2"/>
    <text x="307" y="326" font-size="19" font-weight="bold" fill="#111827" stroke="none">H</text>

    <!-- RING D (5-membered cyclopentane) -->
    <!-- C14 to C15 -->
    <line x1="312" y1="278" x2="360" y2="292"/>
    <!-- C15 to C16 -->
    <line x1="360" y1="292" x2="390" y2="248"/>
    <!-- C16 to C17 -->
    <line x1="390" y1="248" x2="360" y2="208"/>
    <!-- C17 to C13 -->
    <line x1="360" y1="208" x2="312" y2="226"/>

    <!-- C17 alpha-OH (dashed/hashed bond) -->
    <line x1="367" y1="206" x2="372" y2="203" stroke-width="2.2"/>
    <line x1="373" y1="209" x2="380" y2="204" stroke-width="2.2"/>
    <line x1="380" y1="212" x2="389" y2="206" stroke-width="2.2"/>
    <line x1="387" y1="215" x2="398" y2="208" stroke-width="2.2"/>
    <text x="406" y="218" font-size="20" font-weight="bold" fill="#111827" stroke="none">OH</text>

    <!-- C17 beta side-chain: -C(=O)CH2OH -->
    <line x1="360" y1="208" x2="360" y2="150" stroke-width="2.6"/>
    <!-- Carbonyl =O -->
    <line x1="360" y1="148" x2="392" y2="130" stroke-width="2.6"/>
    <line x1="356" y1="140" x2="388" y2="122" stroke-width="2.6"/>
    <text x="398" y="132" font-size="22" font-weight="bold" fill="#111827" stroke="none">O</text>
    <!-- C21 -CH2OH -->
    <line x1="360" y1="150" x2="322" y2="128" stroke-width="2.6"/>
    <line x1="322" y1="128" x2="322" y2="82" stroke-width="2.6"/>
    <text x="310" y="66" font-size="20" font-weight="bold" fill="#111827" stroke="none">OH</text>

  </g>
</svg>