<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#183a5c" />
      <stop offset="50%" stop-color="#0e223d" />
      <stop offset="100%" stop-color="#060e1a" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="mitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="1920" height="1080" fill="url(#bg1)" />

  <!-- Atmospheric Haze -->
  <circle cx="400" cy="350" r="350" fill="#f59e0b" opacity="0.12" filter="url(#softglow)" />
  <circle cx="1600" cy="500" r="400" fill="#6366f1" opacity="0.15" filter="url(#softglow)" />
  <circle cx="960" cy="540" r="500" fill="#38bdf8" opacity="0.08" filter="url(#softglow)" />

  <!-- Mitochondrion (Top Left) -->
  <g transform="translate(280, 240) rotate(-22)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="220" ry="130" fill="none" stroke="#fbbf24" stroke-width="16" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="200" ry="115" fill="url(#mitoGrad)" />
    <!-- Cristae Folds -->
    <path d="M -150 -40 Q -100 0 -150 40 Q -50 20 -30 -60 Q 20 60 70 -50 Q 120 40 160 -30" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" opacity="0.9" />
    <path d="M -120 30 Q -60 -20 0 50 Q 80 -40 140 30" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Lipid Bilayer Membrane (Bottom Left to Center) -->
  <g transform="translate(0, 780)">
    <path d="M 0 100 Q 480 30 960 120 T 1920 80 L 1920 300 L 0 300 Z" fill="url(#memGrad)" opacity="0.85" />
    <!-- Bilayer Heads Outer -->
    <path d="M 0 95 Q 480 25 960 115 T 1920 75" fill="none" stroke="#fbbf24" stroke-width="14" stroke-dasharray="18 10" opacity="0.7" />
    <!-- Protein Channels -->
    <rect x="220" y="20" width="90" height="160" rx="25" fill="#6366f1" opacity="0.9" filter="url(#glow)" />
    <rect x="480" y="40" width="120" height="170" rx="35" fill="#3b82f6" opacity="0.9" />
    <rect x="1100" y="60" width="100" height="150" rx="30" fill="#8b5cf6" opacity="0.85" />
  </g>

  <!-- DNA Double Helix (Right Side) -->
  <g transform="translate(1620, 100)" filter="url(#glow)">
    <!-- Strand 1 -->
    <path d="M 0 0 Q 150 180 0 360 T 0 720 T 0 1080" fill="none" stroke="url(#dnaGrad)" stroke-width="16" opacity="0.9" />
    <!-- Strand 2 -->
    <path d="M 0 180 Q -150 360 0 540 T 0 900 T 0 1260" fill="none" stroke="url(#dnaGrad)" stroke-width="14" opacity="0.75" />
    <!-- Rungs -->
    <line x1="-50" y1="90" x2="50" y2="90" stroke="#38bdf8" stroke-width="6" opacity="0.6" />
    <line x1="-90" y1="270" x2="90" y2="270" stroke="#c084fc" stroke-width="6" opacity="0.7" />
    <line x1="-50" y1="450" x2="50" y2="450" stroke="#fbbf24" stroke-width="6" opacity="0.6" />
    <line x1="-90" y1="630" x2="90" y2="630" stroke="#34d399" stroke-width="6" opacity="0.7" />
    <line x1="-60" y1="810" x2="60" y2="810" stroke="#f472b6" stroke-width="6" opacity="0.6" />
  </g>

  <!-- Ball-and-Stick Molecule (Lower Left) -->
  <g transform="translate(380, 520)" filter="url(#glow)">
    <line x1="0" y1="0" x2="60" y2="-40" stroke="#cbd5e1" stroke-width="6" />
    <line x1="60" y1="-40" x2="120" y2="0" stroke="#cbd5e1" stroke-width="6" />
    <line x1="120" y1="0" x2="120" y2="70" stroke="#cbd5e1" stroke-width="6" />
    <line x1="120" y1="70" x2="60" y2="110" stroke="#cbd5e1" stroke-width="6" />
    <line x1="60" y1="110" x2="0" y2="70" stroke="#cbd5e1" stroke-width="6" />
    <line x1="0" y1="70" x2="0" y2="0" stroke="#cbd5e1" stroke-width="6" />
    <!-- Atoms -->
    <circle cx="0" cy="0" r="18" fill="#ef4444" />
    <circle cx="60" cy="-40" r="14" fill="#f8fafc" />
    <circle cx="120" cy="0" r="18" fill="#ef4444" />
    <circle cx="120" cy="70" r="14" fill="#f8fafc" />
    <circle cx="60" cy="110" r="18" fill="#3b82f6" />
    <circle cx="0" cy="70" r="14" fill="#f8fafc" />
  </g>

  <!-- Floating Particles & Bokeh -->
  <circle cx="620" cy="280" r="12" fill="#fbbf24" opacity="0.7" filter="url(#glow)" />
  <circle cx="900" cy="380" r="18" fill="#38bdf8" opacity="0.6" filter="url(#glow)" />
  <circle cx="1180" cy="250" r="24" fill="#c084fc" opacity="0.5" filter="url(#glow)" />
  <circle cx="820" cy="640" r="10" fill="#34d399" opacity="0.7" />
  <circle cx="1350" cy="680" r="16" fill="#fbbf24" opacity="0.6" />
</svg>